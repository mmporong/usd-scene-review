name: CPU contracts and candidate packaging
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved from official tag
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10.16'
      - run: python -m pip install usd-core==24.5 Pillow==10.4.0 toml==0.10.2
      - name: CPU only; NVIDIA Kit and GUI are not run here
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
